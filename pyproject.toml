[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tennis-ages"
version = "0.1.0"
description = "A Python package for analyzing tennis players' ages and career matches"
requires-python = ">=3.9"
dependencies = [
    "requests",
    "pandas",
    "matplotlib"
]

[tool.setuptools.packages.find]
include = ["tennis_ages*"]
